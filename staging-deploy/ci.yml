# Build and test checks for PlacidCRM.
#
# This file does NOT belong in this repository. Copy it to the PlacidCRM
# application repo as .github/workflows/ci.yml. See README.md here.
#
# Why this exists: docs/TESTING.md says plainly "There is no CI runner; the
# tests run locally against staging, by hand." The intended pipeline
# (GitHub -> CI -> staging -> review -> production) is therefore missing its
# CI leg entirely. This is that leg.
#
# Deliberately limited to the checks that need NO database and NO secrets:
#   npx tsc --noEmit   typecheck
#   npm run lint
#   npm run build      catches page-level compile errors tsc misses
#
# The vitest suite is NOT run here on purpose. It requires a tunnel to the
# staging Postgres and it creates and deletes an agency, so running it on
# every push would mutate the same staging data a reviewer is looking at,
# and would need the SSH secrets on every PR from every contributor.
# Wiring it up is a separate decision, not a side effect of adding CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # Adjust to match the droplet's Node major if it differs.
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Run last: it is the slowest and the most likely to fail, and the two
      # cheap checks above usually explain why.
      - name: Build
        run: npm run build
