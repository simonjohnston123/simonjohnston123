# PlacidCRM production stack for a DigitalOcean droplet.
# Auto-HTTPS via Caddy — no manual TLS certificate steps.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires a .env file next to it with AUTH_SECRET, POSTGRES_PASSWORD and
# ACME_EMAIL (the deploy/cloud-init.yaml generates this for you on first boot).

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: placid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: placidcrm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placid"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://placid:${POSTGRES_PASSWORD}@db:5432/placidcrm?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-https://placidcrm.com}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-placidcrm.com}
      NODE_ENV: production
      # Comms providers — automations send for real once these are set in .env.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      INBOUND_DOMAIN: ${INBOUND_DOMAIN:-inbox.placid.group}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      INBOUND_TOKEN: ${INBOUND_TOKEN:-}
      # Email receive (IMAP) cron auth — scheduler calls /api/cron/email-sync.
      CRON_SECRET: ${CRON_SECRET:-}
      # Meta (Facebook + Instagram) OAuth app — flips those channels live once set.
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Stripe platform billing (charge businesses for PlacidCRM plans).
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Embedded white-label Stripe Connect payments + platform fee.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      PLATFORM_FEE_PERCENT: ${PLATFORM_FEE_PERCENT:-2}
      STRIPE_CONNECT_CLIENT_ID: ${STRIPE_CONNECT_CLIENT_ID:-}
      # eBay OAuth (platform app) — businesses connect their own eBay. RUNAME is
      # the redirect config; VERIFICATION_TOKEN secures the account-deletion webhook.
      EBAY_CLIENT_ID: ${EBAY_CLIENT_ID:-}
      EBAY_CLIENT_SECRET: ${EBAY_CLIENT_SECRET:-}
      EBAY_RUNAME: ${EBAY_RUNAME:-}
      EBAY_VERIFICATION_TOKEN: ${EBAY_VERIFICATION_TOKEN:-}
      # Shopify OAuth (platform app). Client ID is public (has a built-in default);
      # the Client Secret is entered encrypted at /admin/integrations.
      SHOPIFY_CLIENT_ID: ${SHOPIFY_CLIENT_ID:-}
      SHOPIFY_CLIENT_SECRET: ${SHOPIFY_CLIENT_SECRET:-}
      # Placid Storage yard feed (Storage tab pulls live yard data from the storage app).
      STORAGE_URL: ${STORAGE_URL:-https://placidstoragesolutions.com.au}
      STORAGE_ADMIN_TOKEN: ${STORAGE_ADMIN_TOKEN:-}
      # AI helpers (pipeline stage generation, etc.). Optional — features fall back to heuristics.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Social poster — YouTube OAuth app (Google Cloud). Optional until connected.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@placidcrm.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  uploads:
