# PlacidCRM reverse proxy.
#
# Serves the admin app + tenant public sites. Handles the apex domain and any
# tenant custom domains you point at this server. TLS certs live in
# ./nginx/certs (mounted read-only). See DEPLOY.md for issuing certs.

upstream placidcrm_app {
    server app:3000;
}

# Redirect all HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow ACME http-01 challenges through if you use certbot's webroot mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Matches placidcrm.com, www.placidcrm.com, tenant subdomains, and any
    # custom domains you CNAME to this server.
    server_name placidcrm.com www.placidcrm.com *.placidcrm.com _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25m;

    location / {
        proxy_pass http://placidcrm_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
