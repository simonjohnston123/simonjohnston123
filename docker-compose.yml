services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placid}
      POSTGRES_DB: ${POSTGRES_DB:-placidcrm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placid}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-placid}:${POSTGRES_PASSWORD:-placid}@db:5432/${POSTGRES_DB:-placidcrm}?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-placidcrm.com}
      NODE_ENV: production
    ports:
      - "3000:3000"

  # Reverse proxy + TLS termination. Comment this out if you terminate TLS
  # elsewhere (e.g. a DigitalOcean load balancer).
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/placidcrm.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
